# Panel web de administracion de CYPHERLOCK como sitio estatico en Render.
# Render -> New -> Blueprint -> este repositorio.
services:
  - type: web
    name: cypherlock-admin-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # El WebSocket va directo a la API (las reescrituras no pasan WebSocket).
      - key: VITE_WS_BASE_URL
        value: https://cypherlock-api.onrender.com
    routes:
      # HTTP a la API por el mismo origen: no hace falta abrir CORS en la API.
      - type: rewrite
        source: /api/*
        destination: https://cypherlock-api.onrender.com/api/*
      # SPA: cualquier otra ruta la resuelve React Router.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
